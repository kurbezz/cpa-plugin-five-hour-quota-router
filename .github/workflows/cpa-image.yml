name: Patched CPA image
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['docker/**', '.github/workflows/cpa-image.yml', 'docs/patches/cpa-v8.0.20-scheduler-retry-after.patch', '*.go', 'go.mod', 'go.sum']
  pull_request:
    paths: ['docker/**', '.github/workflows/cpa-image.yml', 'docs/patches/cpa-v8.0.20-scheduler-retry-after.patch', '*.go', 'go.mod', 'go.sum']
permissions:
  contents: read
concurrency:
  group: cpa-image-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate and isolated verifier
        run: |
          docker buildx build --platform linux/amd64 --load --target runtime -f docker/cpa.Dockerfile --build-arg REPO_REV="$GITHUB_SHA" --build-arg BUILD_DATE="$(git show -s --format=%cI HEAD)" -t cpa-candidate .
          docker buildx build --platform linux/amd64 --load --target verify -f docker/cpa.Dockerfile --build-arg REPO_REV="$GITHUB_SHA" --build-arg BUILD_DATE="$(git show -s --format=%cI HEAD)" -t cpa-verifier .
      - name: Verify exact candidate bytes and offline transport
        run: |
          candidate=$(docker run --rm --network none --entrypoint sha256sum cpa-candidate /CLIProxyAPI/CLIProxyAPI | cut -d' ' -f1)
          verifier=$(docker run --rm --network none --entrypoint sha256sum cpa-verifier /CLIProxyAPI/CLIProxyAPI | cut -d' ' -f1)
          test "$candidate" = "$verifier"
          docker run --rm --network none cpa-verifier | tee wire-evidence.jsonl
          docker image inspect cpa-candidate > candidate-inspect.json
          docker save -o candidate.tar cpa-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-candidate-${{ github.sha }}
          path: |
            candidate.tar
            candidate-inspect.json
            wire-evidence.jsonl
          retention-days: 3
  publish:
    needs: validate
    if: github.repository == 'kurbezz/cpa-plugin-five-hour-quota-router' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cpa-candidate-${{ github.sha }}
      - name: Load validated candidate
        run: docker load -i candidate.tar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish same candidate and report digest
        run: |
          image=ghcr.io/kurbezz/cpa-plugin-five-hour-quota-router
          docker tag cpa-candidate "$image:sha-$GITHUB_SHA"
          docker tag cpa-candidate "$image:cpa-8.0.20-retry-after"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:cpa-8.0.20-retry-after"
          digest=$(docker image inspect "$image:sha-$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          echo "Validated Linux/amd64 CPA image: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Anonymous digest pull and package visibility still require independent verification." >> "$GITHUB_STEP_SUMMARY"
